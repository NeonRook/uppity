name: Set up the toolchain
description: >-
  Installs the mise-pinned Node and pnpm toolchain, restores the dependency cache, installs
  dependencies and optionally compiles Paraglide messages. Assumes the repository is already
  checked out.

inputs:
  paraglide:
    description: >-
      Compile Paraglide messages after installing. Set to "false" for jobs that neither typecheck,
      lint, nor run the application.
    required: false
    default: "true"

runs:
  using: composite
  steps:
    - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4
      with:
        install_args: node pnpm

    - id: pnpm-store
      run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      shell: bash

    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: ${{ steps.pnpm-store.outputs.path }}
        key: pnpm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
        restore-keys: |
          pnpm-${{ runner.os }}-${{ runner.arch }}-

    - run: pnpm install --frozen-lockfile
      shell: bash

    - if: inputs.paraglide == 'true'
      run: pnpm i18n:generate
      shell: bash
