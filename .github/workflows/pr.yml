name: PR

on:
  # No `branches` filter. On a pull_request event it matches the base branch, so
  # filtering to main leaves a pull request stacked on another branch with no
  # checks at all until it retargets — which is after the one below it merges.
  pull_request:

permissions:
  contents: read

concurrency:
  group: pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  checks:
    uses: ./.github/workflows/checks.yml

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
          # Licences that cannot be combined into an AGPL-3.0-only distribution. A starting
          # list, not an exhaustive legal analysis — tune as false positives appear.
          deny-licenses: >-
            MPL-1.1, CDDL-1.0, CDDL-1.1, EPL-1.0, CPL-1.0, NPL-1.1,
            SSPL-1.0, BUSL-1.1, Elastic-2.0, CC-BY-NC-4.0

  # A blocking `changeset status` check used to live here. Changesets' own guidance is
  # not to block on a missing changeset — not every change warrants a release — so the
  # prompt now comes from the Changesets GitHub App, which comments on the pull request
  # instead of failing it. Nothing in this repository configures that; it is installed
  # at the repository level.

  zizmor:
    name: Workflow Lint
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: zizmorcore/zizmor-action@70fb788f84895a7701f5643d103d587e460b5c99 # v0.6.3
        with:
          # advanced-security uploads SARIF via codeql-action/upload-sarif, which 403s
          # on a fork PR's read-only token and rethrows — failing this blocking check
          # for a reason an external contributor cannot fix. Same-repo PRs still get
          # SARIF in the Security tab; fork PRs get the same findings as annotations.
          advanced-security: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
          annotations: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
