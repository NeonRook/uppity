name: Checks

on:
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    name: Lint & Format
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-toolchain
      - run: pnpm lint:ci

  typecheck:
    name: Type Check
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-toolchain
      - run: pnpm check

  unit:
    name: Unit Tests
    runs-on: blacksmith-4vcpu-ubuntu-2404
    services: &postgres-service
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        # Probe over TCP: during first-run setup the image starts a temporary server on the
        # Unix socket only, and a socket probe would report it ready. Polling every second
        # stops each test job idling up to ten seconds after the real server is up.
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres -d postgres"
          --health-interval 1s
          --health-timeout 5s
          --health-retries 60
    env:
      DATABASE_URL: &database-url postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-toolchain
      - uses: ./.github/actions/setup-playwright
      - run: pnpm test:unit run

  e2e:
    name: E2E Tests
    runs-on: blacksmith-2vcpu-ubuntu-2404
    services: *postgres-service
    env:
      DATABASE_URL: *database-url
      # better-auth reads this from process.env at runtime; the build only needs a
      # non-empty value to be present. Never the real secret.
      BETTER_AUTH_SECRET: ci-placeholder-not-a-real-secret
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-toolchain
      - uses: ./.github/actions/setup-playwright
      - run: pnpm db:migrate
      - run: pnpm test:e2e

  build:
    name: Build
    runs-on: blacksmith-4vcpu-ubuntu-2404
    env:
      BETTER_AUTH_SECRET: ci-placeholder-not-a-real-secret
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-toolchain
      - run: pnpm build:all

# Dependency auditing does not live here. A PR-only audit learns nothing during a quiet
# week with no dependency-touching PRs, so it runs on a schedule (plus pull requests) in
# audit.yml, using trivy fs to report SARIF to the Security tab, non-blocking.
