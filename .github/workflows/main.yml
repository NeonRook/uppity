name: Main

on:
  push:
    branches: [main]
  # Safe to run by hand: select-mode derives what to do from the repository's own
  # state, so a dispatch with nothing pending resolves to `none` and does nothing
  # beyond rebuilding the edge image. Needed because a run that fails at startup
  # cannot be re-run, and without this there is no other way to retrigger a release.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: main
  # Never cancel a publish mid-flight: an interrupted run can leave a git tag
  # with no corresponding image.
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/checks.yml

  select-mode:
    name: Select Mode
    runs-on: ubuntu-26.04
    outputs:
      mode: ${{ steps.select-mode.outputs.mode }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-toolchain
        with:
          paraglide: "false"

      # `version` when non-empty changesets are pending, `publish` when the version
      # pull request has just merged and the resulting `v<version>` tag does not exist
      # yet, `none` otherwise (including when only empty changesets are pending —
      # nothing to release, so no version pull request is opened for them).
      #
      # Under the hood this is `changeset publish-plan`, which consults local and
      # remote tags. That makes the release decision available BEFORE anything is
      # built, rather than inferred afterwards from what the release step printed —
      # which is how the v1 action worked, and how it silently stopped working when
      # the v3 CLI dropped the "New tag:" line it parsed.
      - name: Select mode
        id: select-mode
        uses: changesets/action/select-mode@198f833dd7d863100ea6e28967bc9a9fdefadb0a # v2.1.0

      - name: Read package version
        id: version
        run: echo "version=$(jq -r .version package.json)" >> "$GITHUB_OUTPUT"

  version:
    name: Version
    runs-on: ubuntu-26.04
    needs: [checks, select-mode]
    if: needs.select-mode.outputs.mode == 'version'
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # changeset version reads git history to attribute changelog entries.
          fetch-depth: 0
          # v2 pushes the version branch through the GitHub API instead of the git
          # CLI, so no checkout in this repository has to keep credentials on disk any
          # more. It also means the "chore: version packages" commit lands signed with
          # GitHub's GPG key.
          persist-credentials: false

      - uses: ./.github/actions/setup-toolchain
        with:
          paraglide: "false"

      - name: Open or update the version pull request
        uses: changesets/action/version@198f833dd7d863100ea6e28967bc9a9fdefadb0a # v2.1.0
        with:
          script: aubr changeset:version
          pr-title: "chore: version packages"
          commit-message: "chore: version packages"

  publish:
    needs: [checks, select-mode]
    # A caller job's permissions are the ceiling for the workflow it calls — a reusable
    # workflow can narrow them but never widen them. These are the union of what
    # publish-image.yml's build, merge and scan jobs request; each job there still
    # narrows to its own subset.
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      security-events: write
    uses: ./.github/workflows/publish-image.yml
    with:
      tags: |
        type=edge,branch=main
        type=sha,prefix=main-,format=short
        type=semver,pattern={{version}},value=v${{ needs.select-mode.outputs.version }},enable=${{ needs.select-mode.outputs.mode == 'publish' }}
        type=semver,pattern={{major}}.{{minor}},value=v${{ needs.select-mode.outputs.version }},enable=${{ needs.select-mode.outputs.mode == 'publish' }}
        type=raw,value=latest,enable=${{ needs.select-mode.outputs.mode == 'publish' }}

  release:
    name: Release
    runs-on: ubuntu-26.04
    needs: [select-mode, publish]
    if: needs.select-mode.outputs.mode == 'publish'
    permissions:
      contents: write
    steps:
      # github.sha is the merged "Version Packages" commit, so CHANGELOG.md here
      # already contains the section changesets just generated.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-toolchain
        with:
          paraglide: "false"

      # Tagging waits until publish has pushed the manifest list: a `v<version>` tag
      # with no image behind it is exactly what this workflow's cancel-in-progress:
      # false setting exists to avoid. The tag goes up through the GitHub API, so it
      # arrives signed.
      #
      # push-git-tags has to be set explicitly. v2 decoupled it from
      # create-github-releases and defaults it to true, so leaving it off would have
      # tagged from wherever this step ran regardless of the setting below.
      - name: Push the git tag
        uses: changesets/action/publish@198f833dd7d863100ea6e28967bc9a9fdefadb0a # v2.1.0
        with:
          script: aubr changeset:tag
          push-git-tags: true
          # The release notes below carry the digest and the `gh attestation verify`
          # command README.md promises, neither of which this action can know about.
          # Let it tag; the release is written by the next step.
          create-github-releases: false

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.select-mode.outputs.version }}
          IMAGE: ${{ needs.publish.outputs.image }}
          DIGEST: ${{ needs.publish.outputs.digest }}
          REPO: ${{ github.repository }}
        run: |
          if ! grep -q "^## ${VERSION}\$" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no '## ${VERSION}' section — refusing to cut a release with empty notes"
            exit 1
          fi
          notes=$(mktemp)
          awk -v want="## $VERSION" '
            $0 == want { capture = 1; next }
            capture && /^## / { exit }
            capture { print }
          ' CHANGELOG.md > "$notes"
          {
            echo
            echo "## Container image"
            echo
            echo '```'
            echo "docker pull ${IMAGE}:${VERSION}"
            echo '```'
            echo
            echo "Digest: \`${DIGEST}\`"
            echo
            echo "Verify build provenance:"
            echo
            echo '```'
            echo "gh attestation verify oci://${IMAGE}:${VERSION} --repo ${REPO}"
            echo '```'
          } >> "$notes"
          # --verify-tag rather than --target: the previous step is what creates the
          # tag now, so a missing one means that step did not do its job and the
          # release should fail loudly instead of quietly tagging github.sha itself.
          gh release create "v${VERSION}" --verify-tag --title "v${VERSION}" --notes-file "$notes"
