name: Audit

on:
  schedule:
    # 06:17 UTC daily. Deliberately off the hour: GitHub's scheduler is congested at
    # :00 and queues jobs scheduled there, sometimes by tens of minutes.
    - cron: "17 6 * * *"
  # No `branches` filter: it matches the base branch, so filtering to main leaves
  # a pull request stacked on another branch unscanned until it retargets.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependencies:
    name: Dependency Scan
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      # exit-code 0 keeps this non-blocking: the SARIF upload is the report, and a
      # newly disclosed advisory against unchanged dependencies should not fail an
      # unrelated pull request.
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln
          format: sarif
          output: trivy-deps.sarif
          severity: HIGH,CRITICAL
          # Without this, entrypoint.sh unsets TRIVY_SEVERITY whenever format=sarif and
          # reports every severity, silently ignoring the line above.
          limit-severities-for-sarif: true
          exit-code: "0"
        env:
          # Mandatory. Trivy skips dev dependencies by default, and most of this
          # project's advisories arrive through the dev toolchain — without this the
          # scan looks clean when it is not.
          TRIVY_INCLUDE_DEV_DEPS: "true"

      # A fork pull request gets a read-only token regardless of the permissions
      # block, so the upload cannot succeed. Skip rather than fail.
      - if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4
        with:
          sarif_file: trivy-deps.sarif
          category: trivy-dependencies

      # Trivy's bun.lock parser reads only top-level/hoisted entries, so nested
      # duplicate resolutions (e.g. unplugin/picomatch) are invisible to it.
      # bun audit does see them. Log-only: this is a second pair of eyes, not a gate.
      - uses: ./.github/actions/setup-bun
        with:
          paraglide: "false"
      - name: Audit nested resolutions
        continue-on-error: true
        run: bun audit --audit-level=high
