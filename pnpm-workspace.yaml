engineStrict: true
strictDepBuilds: true

overrides:
  brace-expansion: ^5.0.9
  defu: ^6.1.5
  flatted: ^3.4.2
  kysely: ^0.28.17
  postcss: ^8.5.23
  ws: ^8.21.0

# esbuild's postinstall only validates the binary its platform package already
# ships, and protobufjs's only warns about a mismatched major, so skipping them
# loses nothing.
allowBuilds:
  esbuild: false
  protobufjs: false
