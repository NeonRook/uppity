[tools]
actionlint = "1"
# The registry short name resolves to aube's packslip, which lists aube as its
# only executable, so aubr and aubx get no shims.
"github:aubepkg/aube" = "2"
node = "26"

[env]
_.path = ["{{config_root}}/node_modules/.bin"]

# Absent in CI, which sets these in the workflow. mise skips a missing file.
_.file = ".env"
