[tools]
actionlint = "1"
pnpm = "12"
node = "26"

[env]
_.path = ["{{config_root}}/node_modules/.bin"]
_.file = ".env"

[tasks."docker:build"]
description = "Build the production image as ghcr.io/neonrook/uppity:dev"
run = """
docker build \
  -t ghcr.io/neonrook/uppity:dev \
  -t ghcr.io/neonrook/uppity:$(git rev-parse --short HEAD) \
  .
"""
