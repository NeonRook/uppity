x-worker: &worker
  image: ghcr.io/neonrook/uppity:latest
  # Or build locally:
  # build: .
  restart: unless-stopped
  environment: &worker-env
    DATABASE_URL: "postgres://uppity:${DB_PASSWORD:-uppity}@db:5432/uppity"
    SELF_HOSTED: "${SELF_HOSTED:-}"
    SMTP_HOST: "${SMTP_HOST:-}"
    SMTP_PORT: "${SMTP_PORT:-587}"
    SMTP_USER: "${SMTP_USER:-}"
    SMTP_PASSWORD: "${SMTP_PASSWORD:-}"
    SMTP_FROM: "${SMTP_FROM:-}"
  healthcheck:
    disable: true
  depends_on:
    db:
      condition: service_healthy

services:
  app:
    image: ghcr.io/neonrook/uppity:latest
    # Or build locally:
    # build: .
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      DATABASE_URL: "postgres://uppity:${DB_PASSWORD:-uppity}@db:5432/uppity"
      SELF_HOSTED: "${SELF_HOSTED:-}"
      BETTER_AUTH_SECRET: "${BETTER_AUTH_SECRET}"
      BETTER_AUTH_URL: "${BETTER_AUTH_URL:-https://localhost:3000}"
      BETTER_AUTH_TRUSTED_ORIGINS: "${BETTER_AUTH_TRUSTED_ORIGINS:-https://localhost:3000}"
      ORIGIN: "${ORIGIN:-}"
      HOST_HEADER: "${HOST_HEADER:-}"
      UPPITY_STATUS_PAGE_CNAME_TARGET: "${UPPITY_STATUS_PAGE_CNAME_TARGET:-}"
      CLIENT_IP_HEADER: "${CLIENT_IP_HEADER:-}"
      SMTP_HOST: "${SMTP_HOST:-}"
      SMTP_PORT: "${SMTP_PORT:-587}"
      SMTP_USER: "${SMTP_USER:-}"
      SMTP_PASSWORD: "${SMTP_PASSWORD:-}"
      SMTP_FROM: "${SMTP_FROM:-}"
      RESEND_WEBHOOK_SECRET: "${RESEND_WEBHOOK_SECRET:-}"
      TURNSTILE_SITE_KEY: "${TURNSTILE_SITE_KEY:-}"
      TURNSTILE_SECRET_KEY: "${TURNSTILE_SECRET_KEY:-}"
      UPPITY_UNSOLICITED_MAIL_DAILY_CEILING: "${UPPITY_UNSOLICITED_MAIL_DAILY_CEILING:-}"
      UPPITY_MAIL_REPUTATION_WINDOW_DAYS: "${UPPITY_MAIL_REPUTATION_WINDOW_DAYS:-}"
      UPPITY_MAIL_BOUNCE_MIN: "${UPPITY_MAIL_BOUNCE_MIN:-}"
      UPPITY_MAIL_BOUNCE_PERCENT: "${UPPITY_MAIL_BOUNCE_PERCENT:-}"
      UPPITY_MAIL_COMPLAINT_MIN: "${UPPITY_MAIL_COMPLAINT_MIN:-}"
      UPPITY_MAIL_COMPLAINT_PER_MILLE: "${UPPITY_MAIL_COMPLAINT_PER_MILLE:-}"
      UPPITY_OPS_ALERT_EMAIL: "${UPPITY_OPS_ALERT_EMAIL:-}"
      UPPITY_OPS_ALERT_DISCORD_WEBHOOK_URL: "${UPPITY_OPS_ALERT_DISCORD_WEBHOOK_URL:-}"
    command: ["sh", "-c", "./entrypoint.sh migrate && ./entrypoint.sh serve"]
    depends_on:
      db:
        condition: service_healthy

  worker-monitor:
    <<: *worker
    environment:
      <<: *worker-env
      UPPITY_WORKER_BATCH_SIZE: "${UPPITY_WORKER_BATCH_SIZE:-10}"
      UPPITY_MAIL_REPUTATION_WINDOW_DAYS: "${UPPITY_MAIL_REPUTATION_WINDOW_DAYS:-}"
      UPPITY_SUPPRESSED_SUBSCRIBER_RETENTION_DAYS: "${UPPITY_SUPPRESSED_SUBSCRIBER_RETENTION_DAYS:-}"
    command: ["./entrypoint.sh", "worker-monitor"]
    deploy:
      replicas: 1 # Scale up for horizontal scaling

  worker-notifier:
    <<: *worker
    environment:
      <<: *worker-env
      BETTER_AUTH_URL: "${BETTER_AUTH_URL:-https://localhost:3000}"
      UPPITY_ALLOW_PRIVATE_TARGETS: "${UPPITY_ALLOW_PRIVATE_TARGETS:-}"
      UPPITY_OPS_ALERT_EMAIL: "${UPPITY_OPS_ALERT_EMAIL:-}"
      UPPITY_OPS_ALERT_DISCORD_WEBHOOK_URL: "${UPPITY_OPS_ALERT_DISCORD_WEBHOOK_URL:-}"
      UPPITY_OPS_ALERT_COOLDOWN_HOURS: "${UPPITY_OPS_ALERT_COOLDOWN_HOURS:-6}"
    command: ["./entrypoint.sh", "worker-notifier"]
    deploy:
      replicas: 1 # Scale up once NEO-29 lands and LISTEN-path race is fixed

  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: uppity
      POSTGRES_PASSWORD: ${DB_PASSWORD:-uppity}
      POSTGRES_DB: uppity
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uppity"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
