services:
  app:
    image: ghcr.io/neonrook/uppity:latest
    # Or build locally:
    # build: .
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      DATABASE_URL: "postgres://uppity:${DB_PASSWORD:-uppity}@db:5432/uppity"
      BETTER_AUTH_SECRET: "${BETTER_AUTH_SECRET}"
      BETTER_AUTH_URL: "${BETTER_AUTH_URL:-https://localhost:3000}"
      BETTER_AUTH_TRUSTED_ORIGINS: "${BETTER_AUTH_TRUSTED_ORIGINS:-https://localhost:3000}"
      # Set when a reverse proxy terminates TLS, otherwise absolute URLs and
      # form actions are built against the container's own http:// address.
      ORIGIN: "${ORIGIN:-}"
      SMTP_HOST: "${SMTP_HOST:-}"
      SMTP_PORT: "${SMTP_PORT:-587}"
      SMTP_USER: "${SMTP_USER:-}"
      SMTP_PASSWORD: "${SMTP_PASSWORD:-}"
      SMTP_FROM: "${SMTP_FROM:-}"
    # The bundled entry points, not package.json scripts — the image ships no
    # manifest to look them up in.
    command: ["sh", "-c", "deno run -A ./build/migrate.js && deno run -A ./build/serve.js"]
    depends_on:
      db:
        condition: service_healthy
    # Healthcheck comes from the image, which probes itself without needing curl
    # or wget on the runner.

  worker-monitor:
    image: ghcr.io/neonrook/uppity:latest
    # Or build locally:
    # build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: "postgres://uppity:${DB_PASSWORD:-uppity}@db:5432/uppity"
      UPPITY_WORKER_BATCH_SIZE: "${UPPITY_WORKER_BATCH_SIZE:-10}"
    command: ["deno", "run", "-A", "./build/worker-monitor.js"]
    healthcheck:
      disable: true
    depends_on:
      db:
        condition: service_healthy
    deploy:
      replicas: 1 # Scale up for horizontal scaling

  worker-notifier:
    image: ghcr.io/neonrook/uppity:latest
    # Or build locally:
    # build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: "postgres://uppity:${DB_PASSWORD:-uppity}@db:5432/uppity"
    command: ["deno", "run", "-A", "./build/worker-notifier.js"]
    healthcheck:
      disable: true
    depends_on:
      db:
        condition: service_healthy
    deploy:
      replicas: 1 # Scale up once NEO-29 lands and LISTEN-path race is fixed

  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: uppity
      POSTGRES_PASSWORD: ${DB_PASSWORD:-uppity}
      POSTGRES_DB: uppity
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uppity"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
